<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f766e">
  <script src="js/pwa-manifest.js"></script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="رفيق الحفظ">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>المراجعة — رفيق الحفظ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/i18n.js"></script>
</head>
<body>

  <header class="app-header">
    <div class="header-inner">
      <div class="header-nav-title">
        <a href="dashboard.html" class="back-link" title="العودة لدفتر اليوم" data-i18n-title="back_to_dashboard">
          <span>←</span>
          <span data-i18n="back_to_tasks">العودة للمهام</span>
        </a>
        <span class="greeting" data-i18n="nav_review">المراجعة</span>
      </div>

      <div class="header-actions">
        <button type="button" id="btn-install-app" class="header-action-btn install-app-btn hidden" title="تثبيت التطبيق على هاتفك" aria-label="تثبيت التطبيق على هاتفك" data-i18n-title="install_app_title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span class="install-btn-text" data-i18n="install_app_btn">📲 تثبيت التطبيق</span>
        </button>

        <button type="button" class="lang-toggle-btn header-action-btn" title="English / العربية" aria-label="تبديل اللغة">
          <span class="lang-code-text">EN</span>
        </button>

        <button type="button" class="wakelock-toggle-btn header-action-btn" data-wakelock="on" title="إبقاء الشاشة مضاءة">
          <svg class="icon-wakelock-on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
            <circle cx="12" cy="10" r="2.5" fill="currentColor"></circle>
          </svg>
          <svg class="icon-wakelock-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
            <line x1="2" y1="2" x2="22" y2="22" stroke-width="2.2"></line>
          </svg>
        </button>

        <button type="button" class="theme-toggle-btn header-action-btn" title="تبديل المظهر">
          <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4.5" fill="currentColor"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <button type="button" class="sound-toggle-btn header-action-btn" data-sound="on" title="المؤثرات الصوتية" aria-label="المؤثرات الصوتية">
          <svg class="icon-sound-on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
          <svg class="icon-sound-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="container review-hub">
    <div class="review-hub-head">
      <div>
        <h1 data-i18n="review_hub_title">مركز المراجعة</h1>
        <p class="hint" data-i18n="review_hub_sub">أربع محطات يومية: تكرار الأمس، الربط، تثبيت الربع، ثم الختمة الدورية.</p>
      </div>
      <span class="review-date" id="review-date"></span>
    </div>

    <div id="review-content">
      <p class="loading" data-i18n="tasks_loading">جاري تجهيز مهام اليوم…</p>
    </div>

    <section class="review-hub-foot">
      <a href="history.html" class="review-foot-link">
        <span aria-hidden="true">📜</span>
        <span data-i18n="review_hub_history">سجل الأخطاء وتاريخ الإتقان</span>
      </a>
      <a href="dashboard.html" class="review-foot-link">
        <span aria-hidden="true">🏠</span>
        <span data-i18n="back_to_home">العودة للرئيسية</span>
      </a>
    </section>
  </main>

  <script src="js/app.js"></script>
  <script src="js/review.js"></script>
  <script src="js/nav.js"></script>
</body>
</html>
