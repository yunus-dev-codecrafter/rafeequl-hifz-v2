<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f766e">
  <meta name="robots" content="noindex, nofollow">
  <script src="js/pwa-manifest.js"></script>
  <title>رفيق الحفظ — لوحة الإدارة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/i18n.js"></script>
</head>
<body class="admin-body">

  <header class="app-header">
    <div class="header-inner">
      <a href="admin.html" class="header-brand">
        <span class="brand-mark">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
        </span>
        <span class="brand-name" data-i18n="brand_name">رفيق الحفظ</span>
        <span class="admin-badge" data-admin-label="admin_badge">الإدارة</span>
      </a>

      <div class="header-actions">
        <a href="dashboard.html" class="header-action-btn admin-nav-link" data-admin-label="admin_learner_view" title="لوحة المتعلم">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <span data-admin-label="admin_learner_view">لوحة المتعلم</span>
        </a>

        <button type="button" class="lang-toggle-btn header-action-btn" title="English / العربية" aria-label="تبديل اللغة">
          <span class="lang-code-text">EN</span>
        </button>

        <button type="button" class="theme-toggle-btn header-action-btn" title="تبديل المظهر" aria-label="تبديل المظهر">
          <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.5" fill="currentColor"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <button type="button" class="header-action-btn admin-logout" id="admin-logout" title="تسجيل الخروج" aria-label="تسجيل الخروج">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span data-admin-label="admin_logout">خروج</span>
        </button>
      </div>
    </div>
  </header>

  <main class="admin-main">
    <div class="admin-head">
      <div>
        <h1 data-admin-label="admin_title">لوحة الإدارة</h1>
        <p class="hint" id="admin-hello">—</p>
      </div>
      <button type="button" class="btn btn-ghost" id="admin-refresh" data-admin-label="admin_refresh">↻ تحديث</button>
    </div>

    <section class="admin-kpis" id="admin-kpis" aria-live="polite"></section>

    <section class="admin-section">
      <div class="admin-section-head">
        <h2 data-admin-label="admin_users_title">المستخدمون</h2>
        <div class="admin-filters">
          <input type="search" id="admin-search" class="admin-input" data-admin-ph="admin_search_ph" placeholder="ابحث بالاسم أو البريد…">
          <select id="admin-status-filter" class="admin-input">
            <option value="" data-admin-label="admin_all_status">كل الحالات</option>
            <option value="ACTIVE" data-admin-label="admin_status_active">نشط</option>
            <option value="SUSPENDED" data-admin-label="admin_status_suspended">موقوف</option>
            <option value="DISABLED" data-admin-label="admin_status_disabled">معطّل</option>
          </select>
          <select id="admin-role-filter" class="admin-input">
            <option value="USER" data-admin-label="admin_role_learner">المتعلمون</option>
            <option value="*" data-admin-label="admin_role_all">الجميع</option>
            <option value="ADMIN" data-admin-label="admin_role_admin">مشرفون</option>
            <option value="SUPER_ADMIN" data-admin-label="admin_role_super">المشرف العام</option>
          </select>
          <button type="button" class="btn btn-primary" id="admin-apply" data-admin-label="admin_search">بحث</button>
        </div>
      </div>

      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th data-admin-label="th_user">المستخدم</th>
              <th data-admin-label="th_status">الحالة</th>
              <th data-admin-label="th_page">الصفحة</th>
              <th data-admin-label="th_mistakes">أخطاء نشطة</th>
              <th data-admin-label="th_due">مستحقة</th>
              <th data-admin-label="th_days30">أيام النشاط (30)</th>
              <th data-admin-label="th_last_seen">آخر ظهور</th>
              <th data-admin-label="th_actions">إجراء</th>
            </tr>
          </thead>
          <tbody id="admin-users-body">
            <tr><td colspan="8" class="admin-empty">…</td></tr>
          </tbody>
        </table>
      </div>

      <div class="admin-pager" id="admin-pager"></div>
    </section>

    <section class="admin-section">
      <div class="admin-section-head">
        <h2 data-admin-label="admin_audit_title">سجل إجراءات الإدارة</h2>
        <button type="button" class="btn btn-ghost" id="admin-audit-toggle" data-admin-label="admin_show">إظهار</button>
      </div>
      <div id="admin-audit" class="admin-audit hidden"></div>
    </section>
  </main>

  <div class="admin-drawer-overlay hidden" id="admin-drawer-overlay">
    <aside class="admin-drawer" id="admin-drawer" role="dialog" aria-modal="true" aria-labelledby="ad-name">
      <div class="admin-drawer-head">
        <div>
          <h2 id="ad-name">—</h2>
          <p class="hint" id="ad-email">—</p>
        </div>
        <button type="button" class="admin-drawer-close" id="ad-close" aria-label="إغلاق">✕</button>
      </div>
      <div class="admin-drawer-body" id="ad-body"></div>
    </aside>
  </div>

  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
