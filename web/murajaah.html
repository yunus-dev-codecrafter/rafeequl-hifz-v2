<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f766e">
  <script src="js/pwa-manifest.js"></script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="رفيق الحفظ">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>المراجعة — رفيق الحفظ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/i18n.js"></script>
</head>
<body data-task-type="MURAJAAH">

  <!-- Header -->
  <header class="app-header">
    <div class="header-inner">
      <div class="header-nav-title">
        <a href="dashboard.html" class="back-link" title="العودة لدفتر اليوم" data-i18n-title="back_to_dashboard">
          <span>←</span>
          <span data-i18n="back_to_tasks">العودة للمهام</span>
        </a>
        <span class="greeting" id="page-task-badge" data-i18n="card_murajaah_title">🟣 المراجعة اليومية</span>
      </div>

      <div class="header-actions">
        <!-- Install App Button (PWA) -->
        <button type="button" id="btn-install-app" class="header-action-btn install-app-btn hidden" title="تثبيت التطبيق على هاتفك" aria-label="تثبيت التطبيق على هاتفك" data-i18n-title="install_app_title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span class="install-btn-text" data-i18n="install_app_btn">📲 تثبيت التطبيق</span>
        </button>

        <!-- Language Toggle -->
        <button type="button" class="lang-toggle-btn header-action-btn" title="English / العربية" aria-label="تبديل اللغة">
          <span class="lang-code-text">EN</span>
        </button>

        <!-- Screen Stay-Awake Toggle -->
        <button type="button" class="wakelock-toggle-btn header-action-btn" data-wakelock="on" title="إبقاء الشاشة مضاءة">
          <svg class="icon-wakelock-on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
            <circle cx="12" cy="10" r="2.5" fill="currentColor"></circle>
          </svg>
          <svg class="icon-wakelock-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
            <line x1="2" y1="2" x2="22" y2="22" stroke-width="2.2"></line>
          </svg>
        </button>

        <!-- Theme Toggle -->
        <button type="button" class="theme-toggle-btn header-action-btn" title="تبديل المظهر">
          <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4.5" fill="currentColor"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <!-- Sound Feedback Toggle -->
        <button type="button" class="sound-toggle-btn header-action-btn" data-sound="on" title="المؤثرات الصوتية" aria-label="المؤثرات الصوتية">
          <svg class="icon-sound-on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
          <svg class="icon-sound-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="task-content">
      <p class="loading">جاري تجهيز صفحات المراجعة…</p>
    </div>
  </main>

  <!-- Mistake Logging Modal -->
  <div id="mistake-modal" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <div>
          <h3 data-i18n="mistake_modal_title">سجل خطأ أثناء التلاوة</h3>
          <div id="modal-page-verses" class="modal-page-verses hidden"></div>
        </div>
        <span id="modal-page" class="task-page-badge red">صفحة —</span>
      </div>

      <div class="field">
        <label for="mistake-surah" data-i18n="mistake_select_surah">السورة</label>
        <select id="mistake-surah">
          <option value="" data-i18n="mistake_surah_placeholder">— اختر السورة —</option>
        </select>
      </div>

      <div class="field">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.35rem;">
          <label for="mistake-ayah" style="margin-bottom:0;" data-i18n="mistake_select_ayah">رقم الآية</label>
          <button type="button" id="btn-toggle-all-ayahs" class="btn-toggle-all-ayahs hidden"></button>
        </div>
        <select id="mistake-ayah">
          <option value="" data-i18n="mistake_ayah_placeholder">— اختر الآية —</option>
        </select>
        <div id="ayah-chips-wrap" class="ayah-chips-wrap hidden">
          <div class="ayah-chips-head">
            <span class="ayah-chips-label" data-i18n="ayah_chips_label">آيات هذه الصفحة (انقر للاختيار المباشر):</span>
          </div>
          <div id="ayah-chips-group" class="ayah-chips-group"></div>
        </div>
      </div>

      <div class="field">
        <span class="field-label" data-i18n="mistake_type_label">نوع الخطأ</span>
        <div class="tag-group" id="mistake-tags">
          <button type="button" class="tag-btn active" data-type="TRANSITION_FAILURE" data-i18n="tag_transition">انقطاع / نقلة</button>
          <button type="button" class="tag-btn" data-type="MUTASHABIHAT" data-i18n="tag_mutashabihat">متشابهات</button>
          <button type="button" class="tag-btn" data-type="TAWAQQUF" data-i18n="tag_tawaqquf">توقف</button>
          <button type="button" class="tag-btn" data-type="TASHKEEL" data-i18n="tag_tashkeel">تشكيل</button>
          <button type="button" class="tag-btn" data-type="LAFDH" data-i18n="tag_lafdh">لفظ</button>
        </div>
      </div>

      <div class="field">
        <span class="field-label" data-i18n="mistake_severity_label">درجة الخطأ</span>
        <div class="tag-group" id="mistake-severity">
          <button type="button" class="tag-btn active" data-sev="1" data-i18n="sev_light">بسيط</button>
          <button type="button" class="tag-btn" data-sev="2" data-i18n="sev_medium">متوسط</button>
          <button type="button" class="tag-btn" data-sev="3" data-i18n="sev_severe">شديد</button>
        </div>
      </div>

      <div class="field hidden" id="mistake-confused-wrap">
        <label data-i18n="mistake_confused_label">الالتباس مع آية أخرى (للمتشابهات)</label>
        <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
          <select id="mistake-confused-surah" style="flex:1; min-width:140px;"></select>
          <select id="mistake-confused-ayah" style="flex:1; min-width:110px;"></select>
        </div>
        <p class="hint" style="margin-top:0.35rem;" data-i18n="mistake_confused_hint">اختياري، ومفيد جداً لأخطاء المتشابهات</p>
      </div>

      <div class="field">
        <label for="mistake-note" data-i18n="mistake_notes_label">ملاحظة مساعدة للتذكر (اختياري)</label>
        <textarea id="mistake-note" rows="2" maxlength="5000" placeholder="ملاحظة أثناء التلاوة…" data-i18n-placeholder="mistake_notes_ph"></textarea>
      </div>

      <div class="modal-actions">
        <button type="button" id="modal-cancel" class="btn btn-ghost" data-i18n="btn_cancel">إلغاء</button>
        <button type="button" id="modal-save" class="btn btn-danger" data-i18n="btn_save_mistake">تسجيل الخطأ</button>
      </div>
    </div>
  </div>

  <script src="js/page-notes.js"></script>
  <script src="js/app.js"></script>
  <script src="js/nav.js"></script>
</body>
</html>
