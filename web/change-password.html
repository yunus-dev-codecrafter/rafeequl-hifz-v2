<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f766e">
  <meta name="robots" content="noindex">
  <script src="js/pwa-manifest.js"></script>
  <title>رفيق الحفظ — تغيير كلمة المرور</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/i18n.js"></script>
</head>
<body class="auth-body">

  <main class="auth-container">
    <div style="display:flex; justify-content:flex-end; gap:0.5rem; margin-bottom:0.75rem;">
      <button type="button" class="lang-toggle-btn header-action-btn" title="English / العربية" aria-label="تبديل اللغة">
        <span class="lang-code-text">EN</span>
      </button>
      <button type="button" class="theme-toggle-btn header-action-btn" title="تبديل المظهر" aria-label="تبديل المظهر">
        <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.5" fill="currentColor"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>

    <div class="brand-block">
      <div class="brand-logo" style="display:inline-flex; align-items:center; justify-content:center; width:52px; height:52px; background:var(--accent-soft); border:1px solid var(--accent-soft-border); border-radius:var(--radius-lg); color:var(--accent); margin:0 auto 0.75rem;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
      </div>
      <h1 data-i18n="brand_name">رفيق الحفظ</h1>
    </div>

    <div class="auth-card">
      <h2 style="margin:0 0 0.35rem; font-size:1.25rem;" data-i18n="cp_title">تغيير كلمة المرور</h2>
      <p class="hint" style="margin-top:0;" data-i18n="cp_reason">
        لأمان حسابك، اختر كلمة مرور جديدة قبل المتابعة.
      </p>

      <form id="cp-form" novalidate>
        <div class="field">
          <label for="cp-current" data-i18n="cp_current">كلمة المرور الحالية</label>
          <input type="password" id="cp-current" autocomplete="current-password" required>
        </div>

        <div class="field">
          <label for="cp-new" data-i18n="cp_new">كلمة المرور الجديدة</label>
          <input type="password" id="cp-new" autocomplete="new-password" minlength="8" required>
        </div>

        <div class="field">
          <label for="cp-confirm" data-i18n="cp_confirm">تأكيد كلمة المرور الجديدة</label>
          <input type="password" id="cp-confirm" autocomplete="new-password" minlength="8" required>
        </div>

        <p id="cp-error" class="form-error hidden" role="alert"></p>

        <button type="submit" class="btn btn-primary btn-block" id="cp-submit" data-i18n="cp_save">
          حفظ ومتابعة
        </button>
      </form>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/change-password.js"></script>
</body>
</html>
