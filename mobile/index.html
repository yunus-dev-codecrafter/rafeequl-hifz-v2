<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="رفيق الحفظ — دفتر متابعة حفظ القرآن الكريم اليومي: حفظ جديد، ربط، مراجعة، ومعالجة الأخطاء.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="رفيق الحفظ">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>رفيق الحفظ</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #0f766e;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    #app {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #f4f7f6;
    }
  </style>
</head>
<body>
  <iframe id="app" src="../web/dashboard.html" title="رفيق الحفظ" allow="clipboard-write"></iframe>

  <script>
    // Mobile native wrapper: full-screen WebView shell + PWA entry.
    // Touch-swipe gestures for page cards and flashcards are handled natively by
    // the app inside (app.js / flashcards.js, flagged by document.__hifzGestures).
    // The bridge below only runs as a fallback if the app scripts did not install
    // their own gesture handlers (e.g. stale cached bundle).
    (function () {
      var frame = document.getElementById('app');

      function attachBridge() {
        var doc = null;
        try { doc = frame.contentDocument; } catch (e) { return; } // cross-origin: skip
        if (!doc || doc.__hifzGestures) return;

        var startX = 0, startY = 0, tracking = false;

        doc.addEventListener('touchstart', function (e) {
          if (e.touches.length !== 1) return;
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
          tracking = true;
        }, { passive: true });

        doc.addEventListener('touchend', function (e) {
          if (!tracking) return;
          tracking = false;
          var t = e.changedTouches[0];
          var dx = t.clientX - startX;
          var dy = t.clientY - startY;
          if (Math.abs(dx) <= 50 || Math.abs(dy) >= 45) return;
          var evt;
          try {
            evt = new CustomEvent('hifz:swipe', { detail: { direction: dx < 0 ? 'left' : 'right' } });
          } catch (err) { return; }
          doc.dispatchEvent(evt);
        }, { passive: true });
      }

      frame.addEventListener('load', attachBridge);
    })();
  </script>
</body>
</html>
